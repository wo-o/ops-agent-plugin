# Anchors pytest's rootdir at tests/ so the plugin package above it is never
# collected as a pytest Package: the plugin dir may contain a hyphen (Hermes
# loads plugins by path, so the hyphen is fine at runtime), which pytest's module
# importer cannot import as a package name. conftest.py loads the package
# explicitly as "ops_plugin" instead.
#
# Run:  python3 -m pytest tests -q
[pytest]
addopts = -p no:cacheprovider
